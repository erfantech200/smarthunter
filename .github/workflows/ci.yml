name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  stack:
    # Boots every service with docker compose and checks the health endpoints (Phase 0 DoD).
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose -f infra/docker-compose.yml --env-file .env up -d --build --wait --wait-timeout 240
      - run: make health
      - if: failure()
        run: docker compose -f infra/docker-compose.yml --env-file .env logs --no-color
      - if: always()
        run: docker compose -f infra/docker-compose.yml --env-file .env down -v
